name: Build OnePlus_SukiSU Ultra All

on:
  workflow_dispatch:
    inputs:
      FILE:
        type: choice
        description: "Device Config File"
        required: true
        default: oneplus_13_dodge
        options:
          - oneplus_13_dodge
          - oneplus_10r_v
          - oneplus_nord_3_v
          - oneplus_ace_v
          - oneplus_ace_race_v
          - oneplus_10_pro_v
          - oneplus_10t_v
          - oneplus_11r_b
          - oneplus_ace2_b
          - oneplus_pad_lite_v
          - oneplus_pad_mt6983_v
          - oneplus_ace_2v_v
          - oneplus_ace_pro_v
          - oneplus_11_b
          - oneplus_12r_b
          - oneplus_ace2_pro_b
          - oneplus_ace3_b
          - oneplus_open_b
          - oneplus_nord_ce4_b
          - oneplus_12_b
          - oneplus_pad_go_2_b
          - oneplus_nord_ce4_lite_5g_v
          - oneplus_nord_4_b
          - oneplus_ace_3v_b
          - oneplus_pad_mt6897_v
          - oneplus_13r_b
          - oneplus_ace3_pro_b
          - oneplus_ace5_b
          - oneplus_pad_pro_b
          - oneplus_pad2_b
          - oneplus_nord_ce5_b
          - oneplus_nord_5_b
          - oneplus_ace5_pro_b
          - oneplus_13_b
          - oneplus_13t_b
          - oneplus_13s_b
          - oneplus_pad_2_pro_b
          - oneplus_pad_3_b
          - oneplus_ace5_race_b
          - oneplus_ace5_ultra_b
          - oneplus_pad2_mt6991_b
          - oneplus_ace_6
          - oneplus_ace_6t
          - oneplus_15r
          - oneplus_15
      MANAGER_SOURCE:
        type: choice
        description: "Manager Download Source"
        required: true
        default: OFFICIAL
        options:
          - OFFICIAL
          - SPOOF
          - MIUIX
      SUSFS_CI:
        type: choice
        description: "SUSFS Module Download Source"
        required: true
        default: NoN
        options:
          - CI
          - Release
          - NoN
      SUSFS_META:
        type: string
        description: "Fallback SUSFS to specific commit hash"
        required: false
        default: ""
      DYNAMIC_REPO:
        type: string
        description: "Dynamic Manifest Repo Owner"
        required: true
        default: "Numbersf"
      BUILD_TIME:
        type: string
        description: "Custom Build Time (Enter 'F' for current UTC time)"
        required: false
        default: "Thu Dec 11 04:17:27 UTC 2025"
      KSU_META:
        type: string
        description: "Branch Name (Req) / Custom Tag (Opt) / Commit Hash (Opt)"
        required: false
        default: "builtin/Numbersf/"
      SUFFIX:
        type: string
        description: "Custom Kernel Suffix (Empty for random string)"
        required: false
        default: ""
      SUBLEVEL:
        description: "Custom Kernel Sublevel Spoofing (SUBLEVEL)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "Enable Fast Build?"
        required: true
        default: true
      KPM:
        type: boolean
        description: "Enable Kernel Modules (KPM)?"
        required: true
        default: true
      LSM:
        type: boolean
        description: "Enable Baseband Guard (BBG)?"
        required: true
        default: true
      NETFILTER:
        type: boolean
        description: "Enable Netfilter Extension?"
        required: true
        default: true
      BBR_ECN:
        type: boolean
        description: "Enable Network Optimization (BBR+ECN)?"
        required: true
        default: true
      UNICODE_BYPASS:
        type: boolean
        description: "Add Unicode Invisible Codepoint Bypass?"
        required: true
        default: false
      SCHED:
        type: boolean
        description: "Add Fengchi Driver 1.0?"
        required: true
        default: false
      ZRAM:
        type: boolean
        description: "Add More ZRAM Algorithms?"
        required: true
        default: false
      XUS_FIX:
        type: boolean
        description: "Block 5US Error File Creation?"
        required: true
        default: false
      SUSFS_DEV:
        type: boolean
        description: "Pull SUSFS-DEV branch?"
        required: true
        default: false
      SPACE_NOCLEAN:
        type: boolean
        description: "Disable Space Cleanup?"
        required: true
        default: false
      BUILD_NOCCACHE:
        type: boolean
        description: "Disable Ccache for this build?"
        required: true
        default: false

jobs:
  build:
    name: ${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ github.event.inputs.KPM == 'true' && ' [KPM]' || '' }}${{ github.event.inputs.LSM == 'true' && ' [LSM]' || '' }}${{ github.event.inputs.SCHED == 'true' && ' [SCHED]' || '' }}${{ github.event.inputs.ZRAM == 'true' && ' [ZRAM]' || '' }}For ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout Action Repository
        uses: actions/checkout@v4

      - name: Maximize Build Space
        if: ${{ github.event.inputs.SPACE_NOCLEAN == 'false' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Extract Manifest Info
        id: extract_info
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -e -x
          cd "$GITHUB_WORKSPACE"
          
          # --- Specific Logic for OnePlus 13 Dodge (TheGeniusClub) ---
          if [[ "$FILE" == "oneplus_13_dodge" ]]; then
            echo "Detected OnePlus 13 Dodge (Android 16) target."
            echo "MANIFEST_REPO=TheGeniusClub" >> $GITHUB_ENV
            echo "MANIFEST_BRANCH=main" >> $GITHUB_ENV
            echo "FILE_CONF=oneplus_13_dodge" >> $GITHUB_ENV
            echo "FILE_BASE=OnePlus_13_Dodge" >> $GITHUB_ENV
            echo "CPU=sm8750" >> $GITHUB_ENV
            echo "ANDROID_VERSION=16" >> $GITHUB_ENV
            echo "ANDROID_SHORT_VERSION=16" >> $GITHUB_ENV
            echo "CPUD=dodge" >> $GITHUB_ENV
            echo "BUILD_METHOD=gki" >> $GITHUB_ENV
            echo "value=OnePlus_13_Dodge_Android16" >> "$GITHUB_OUTPUT"
            echo "Dodge Config Set Manually"
            exit 0
          fi
          # -----------------------------------------------------------

          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/Realme/; s/^oppo/Oppo/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "Processing FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          DYNAMIC_REPO_INPUT="${{ github.event.inputs.DYNAMIC_REPO }}"
          declare -A REPOS
          REPOS["OnePlusOSS"]="https://api.github.com/repos/OnePlusOSS/kernel_manifest"
          REPOS["Dynamic"]="https://api.github.com/repos/${DYNAMIC_REPO_INPUT}/kernel_manifest"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local OWNER=$1
            local REPO_URL=$2
            echo "Trying to fetch branch list from ${OWNER}..."
            BRANCHES=$(curl -s ${REPO_URL}/branches | jq -r '.[].name' || true)
            if [[ -z "$BRANCHES" ]]; then
              echo "WARNING: Failed to get branch list for ${OWNER}, skipping."
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/README.md"
              if curl -sf --head "$XML_URL" > /dev/null; then
                echo "Found ${FILE}.xml in ${OWNER} (Branch: $BRANCH)"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true
                FOUND_REPO="$OWNER"
                FOUND_BRANCH="$BRANCH"
                return 0
              fi
            done
            return 1
          }

          if check_repo "OnePlusOSS" "${REPOS["OnePlusOSS"]}"; then
            echo "MANIFEST_REPO=OnePlusOSS" >> $GITHUB_ENV
            echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
          fi

          if [[ -z "$FOUND_REPO" ]]; then
            DYNAMIC_URL="${REPOS["Dynamic"]}"
            DYNAMIC_OWNER=$(echo "$DYNAMIC_URL" | sed -E 's#https://api.github.com/repos/([^/]+)/.*#\1#')
            if check_repo "$DYNAMIC_OWNER" "$DYNAMIC_URL"; then
              echo "MANIFEST_REPO=$DYNAMIC_OWNER" >> $GITHUB_ENV
              echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
            fi
          fi

          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "ERROR: Could not find ${FILE}.xml in dynamic repositories."
            exit 1
          fi

          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "Parsing FILE to get CPU and ANDROID_VERSION..."
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "ERROR: Failed to extract CPU or ANDROID_VERSION from revision."
            exit 1
          fi

          echo "Parsing README.md for CPUD and BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "Build command not found in README.md"
            fi
          else
            echo "README.md download failed or is empty."
          fi
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          set -x
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ github.event.inputs.FILE }}"
          echo "Selected MANAGER_SOURCE: ${{ github.event.inputs.MANAGER_SOURCE }}"
          echo "Selected SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "Custom SUSFS_META: ${{ github.event.inputs.SUSFS_META }}"
          echo "Custom KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "Custom BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}"
          echo "Custom SUFFIX: ${{ github.event.inputs.SUFFIX }}"

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          set -x
          sudo swapoff -a || true
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          set -x
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ github.event.inputs.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"

      - name: Install Dependencies + APTC
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts: true

      - name: Restore Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16

      - name: Initialize Ccache
        if: ${{ github.event.inputs.BUILD_NOCCACHE == 'false' }}
        run: |
          set -x
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "Initializing ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "Ccache initialized successfully"
            else
              echo "Ccache already initialized, skipping."
            fi
          else
            echo "Ccache not installed, skipping."
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          set -x
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -x
          # --- Specific Logic for OnePlus 13 Dodge (TheGeniusClub) ---
          if [[ "$FILE" == "oneplus_13_dodge" ]]; then
            echo "Cloning TheGeniusClub kernel directly..."
            mkdir kernel_workspace
            cd kernel_workspace
            git clone --depth=1 https://github.com/TheGeniusClub/android_kernel_common_oneplus_sm8750 kernel_platform
            echo "Clone completed. Listing top-level structure:"
            ls -la kernel_platform/
            exit 0
          fi
          # -----------------------------------------------------------

          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"

          MANIFEST_REPO="${{ env.MANIFEST_REPO }}"
          MANIFEST_BRANCH="${{ env.MANIFEST_BRANCH }}"
          CPU="${{ env.CPU }}"
          echo "MANIFEST_REPO=$MANIFEST_REPO"
          echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"

          BASE_URL="https://github.com/${MANIFEST_REPO}/kernel_manifest.git"

          echo "Initializing repo with $MANIFEST_REPO branch $MANIFEST_BRANCH..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync

          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

      - name: Detect Kernel Source Structure
        id: detect_structure
        run: |
          set -x
          cd kernel_workspace/kernel_platform
          if [ -d "common" ]; then
            echo "KERNEL_SOURCE_DIR=common" >> $GITHUB_ENV
            echo "Detected GKI Repo Structure (Source in 'common/')"
          else
            echo "KERNEL_SOURCE_DIR=." >> $GITHUB_ENV
            echo "Detected Flat Kernel Structure (Source in Root)"
          fi

      - name: Kernel Version Handling
        run: |
          set -x
          cd kernel_workspace/kernel_platform
          SOURCE_DIR="${{ env.KERNEL_SOURCE_DIR }}"
          
          # Check build.config in source dir or root
          if [ -f "./$SOURCE_DIR/build.config.constants" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "./$SOURCE_DIR/build.config.constants" | cut -d= -f2)
          elif [ -f "./$SOURCE_DIR/build.config.common" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "./$SOURCE_DIR/build.config.common" | cut -d= -f2)
          fi

          if [ -n "$BRANCH" ]; then
            echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV
          else
            echo "No BRANCH found in build.config files. Fallback detection..."
            VERSION=$(make -s kernelversion | cut -d'-' -f1 2>/dev/null || echo "unknown")
            echo "KANDROID_VERSION=16" >> $GITHUB_ENV 
          fi

          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./$SOURCE_DIR/Makefile)

          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "Modifying SUBLEVEL to $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./$SOURCE_DIR/Makefile
          else
            echo "SUBLEVEL not specified, keeping default."
          fi

          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./$SOURCE_DIR/Makefile)

          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version Changed: $ORIG_VERSION -> $NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version: $ORIG_VERSION (No changes)"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi

          # KV1/KV2 fallback logic for version comparison
          if [ -n "$BRANCH" ]; then
              echo "KV1=${BRANCH#*-}"       | cut -d. -f1 >> $GITHUB_ENV
              echo "KV2=${BRANCH#*-}"       | tr -d '.' >> $GITHUB_ENV
          else
              echo "KV1=${NEW_VERSION%%.*}" >> $GITHUB_ENV
              echo "KV2=$(echo $NEW_VERSION | tr -d '.')" >> $GITHUB_ENV
          fi
          echo "KV3=$(echo $NEW_VERSION | tr -d '.')" >> $GITHUB_ENV

      # Custom kernel suffix
      - name: Custom Kernel Suffix if set
        if: ${{ github.event.inputs.SUFFIX != '' }}
        run: |
          set -x
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          SOURCE_DIR="${{ env.KERNEL_SOURCE_DIR }}"

          for path in \
            kernel_platform/$SOURCE_DIR/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$path"
              else
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "Using bazel build, character limit warning applies."
                fi
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            fi
            chmod +x "$path"
          done
          cd kernel_platform
          git add -A
          git commit -m "Custom suffix & removed -dirty" || true

      - name: Custom Kernel Random Suffix if empty
        if: ${{ github.event.inputs.SUFFIX == '' }}
        run: |
          set -x
          cd kernel_workspace
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          SOURCE_DIR="${{ env.KERNEL_SOURCE_DIR }}"

          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"

          for path in \
            kernel_platform/$SOURCE_DIR/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do

            [ -f "$path" ] || continue

            echo "Modifying: $path"
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"

            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$path"
              else
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$path"
            fi
            chmod +x "$path"
          done
          cd kernel_platform
          git add -A
          git commit -m "Random suffix & remove -dirty" || true

      - name: Add SukiSU Ultra
        run: |
          set -x
          cd kernel_workspace/kernel_platform

          KSU_META="${{ github.event.inputs.KSU_META }}"
          if [[ "$(grep -o '/' <<< "$KSU_META" | wc -l)" -lt 2 ]]; then
            echo "ERROR: KSU_META parameter missing necessary delimiter '/'"
            exit 10
          fi

          IFS='/' read -r BRANCH_NAME CUSTOM_TAG MANUAL_HASH <<< "$KSU_META"

          # Check if KernelSU exists to avoid conflicts
          if [ -d "KernelSU" ]; then
            echo "KernelSU directory already exists. Attempting update..."
            cd KernelSU
            git fetch origin "$BRANCH_NAME" --depth=50
            if [[ -n "$MANUAL_HASH" ]]; then
              git checkout "$MANUAL_HASH"
            else
              git checkout "origin/$BRANCH_NAME"
            fi
            cd ..
          else
            echo "Cloning SukiSU Ultra..."
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH_NAME"
          fi

          cd ./KernelSU
          
          if [[ -n "$MANUAL_HASH" ]]; then
            git fetch origin "$BRANCH_NAME" --depth=50
            git checkout "$MANUAL_HASH"
            SHORT_HASH=${MANUAL_HASH:0:8}
          fi

          KSU_API_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$BRANCH_NAME/kernel/Kbuild" | \
            grep -m1 "KSU_VERSION_API :=" | awk -F'= ' '{print $2}' | tr -d '[:space:]')
          if [[ -z "$KSU_API_VERSION" || "$(printf '%s\n' "$KSU_API_VERSION" "3.1.7" | sort -V | head -n1)" != "3.1.7" ]]; then
            KSU_API_VERSION="3.1.7"
          fi
          echo "KSU_API_VERSION=$KSU_API_VERSION" >> $GITHUB_ENV

          GIT_HASH=$(git rev-parse --short HEAD)
          if [[ -n "$MANUAL_HASH" ]]; then
            USE_HASH="$SHORT_HASH"
          else
            USE_HASH="$GIT_HASH"
          fi
          if [[ -z "$CUSTOM_TAG" ]]; then
            VERSION_FULL="v$KSU_API_VERSION-$USE_HASH@$BRANCH_NAME"
          else
            VERSION_FULL="v$KSU_API_VERSION-$CUSTOM_TAG@$BRANCH_NAME[$USE_HASH]"
          fi

          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
          sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild

          VERSION_DEFINITIONS=$(cat <<EOF
            define get_ksu_version_full
            $VERSION_FULL
            endef

            KSU_VERSION_API := $KSU_API_VERSION
            KSU_VERSION_FULL := $VERSION_FULL
          EOF
          )

          awk -v def="$VERSION_DEFINITIONS" '
            /REPO_OWNER :=/ {print; print def; inserted=1; next}
            1
            END {if (!inserted) print def}
          ' kernel/Kbuild > kernel/Kbuild.tmp && mv kernel/Kbuild.tmp kernel/Kbuild

          KSU_VERSION=$(expr $(git rev-list --count main 2>/dev/null || echo 13000) + 37185)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "::group::Kbuild Info Preview"
          grep -A10 "REPO_OWNER" kernel/Kbuild
          grep "KSU_VERSION_FULL" kernel/Kbuild
          echo "::endgroup::"

      - name: Apply Patches SukiSU Ultra
        env:
          FILE: ${{ github.event.inputs.FILE }}
        run: |
          set -x
          mkdir -p $GITHUB_WORKSPACE/debug_logs/patch_rejections
          cd kernel_workspace
          SOURCE_DIR="${{ env.KERNEL_SOURCE_DIR }}"
          
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            SUSFS_META="${{ github.event.inputs.SUSFS_META }}"
            if [ -f "kernel_platform/$SOURCE_DIR/fs/susfs.c" ]; then
                echo "SUSFS already present in source, skipping clone."
            else
                echo "Cloning SUSFS..."
                git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}${{ github.inputs.SUSFS_DEV == 'true' && '-dev' || '' }}
                cd susfs4ksu
                [ -n "$SUSFS_META" ] && git checkout "$SUSFS_META" || echo "Using latest SUSFS"
                cd ..
            fi
          fi
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://github.com/Numbersf/Action-Build.git
          cd kernel_platform
          
          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            if [ ! -f "./$SOURCE_DIR/fs/susfs.c" ]; then
                echo "Applying SUSFS files..."
                cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./$SOURCE_DIR/ || echo "Patch file not found for version"
                if [ -f "./$SOURCE_DIR/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch" ]; then
                    cp ../susfs4ksu/kernel_patches/fs/* ./$SOURCE_DIR/fs/
                    cp ../susfs4ksu/kernel_patches/include/linux/* ./$SOURCE_DIR/include/linux/
                fi
            else
                echo "Skipping SUSFS file copy, files exist."
            fi
          fi

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            if [ -f "./$SOURCE_DIR/crypto/lz4k.c" ]; then
                echo "ZRAM/LZ4K already present, skipping."
            else
                echo "Applying ZRAM files..."
                cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./$SOURCE_DIR/include/linux/
                cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./$SOURCE_DIR/lib/
                cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./$SOURCE_DIR/crypto/
                cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./$SOURCE_DIR/lib/
            fi
          fi

          cd ./$SOURCE_DIR
          GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')

          if [ "$GKI_V" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "Fixing 5.15 legacy bugs..."
            cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch || true
          fi

          if [[ "${{ env.KV2 }}" == "66" && "${{ env.KV3 }}" -le 6630 && "${{ github.event.inputs.SUSFS_META }}" != "-1" ]]; then
            TRUSTY_EXISTS="false"
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml"; then
              TRUSTY_EXISTS="true"
            fi
            if [[ "$TRUSTY_EXISTS" == "false" ]]; then
              echo "Fixing Trusty missing for 6.6..."
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
              sed -i '/#include <trace\/hooks\/fs.h>/d' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch
            fi
          fi

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            if [ -f "50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch" ]; then
                echo "Applying SUSFS patch..."
                if patch -p1 --dry-run -N < "50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch" > /dev/null 2>&1; then
                    patch -p1 < "50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch"
                else
                    echo "SUSFS patch already applied or conflicts. Skipping."
                    find . -name "*.rej" -exec cp {} $GITHUB_WORKSPACE/debug_logs/patch_rejections/ \;
                fi
            fi
            
            if [ "${{ github.event.inputs.XUS_FIX }}" = "true" ]; then
              cp ../../Action-Build/patches/No_5uS.patch ./
              patch -p1 < No_5uS.patch || true
            fi    
          fi

      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ fromJSON(env.KV1) >= 6 && fromJSON(env.KV2) >= 66 && github.event.inputs.SCHED == 'false' }}
        run: |
          set -x
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && { echo "HMBIRD code exists, skipping."; exit 0; }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true

      - name: Apply UNICODE_BYPASS
        if: ${{ github.event.inputs.UNICODE_BYPASS == 'true' }}
        run: |
          set -x
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [ "$KV1" -lt 6 ]; then
            patch -p1 --dry-run --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" && patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || echo "Unicode patch skipped"
          else
            patch -p1 --dry-run --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" && patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || echo "Unicode patch skipped"
          fi

      - name: Apply ZRAM
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        run: |
          set -x
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [ ! -f "crypto/lz4k.c" ]; then
             echo "Patching lz4kd..."
             patch -p1 -F 3 < "${PATCH_DIR}/lz4kd.patch" || true
          fi
          if [ ! -f "lib/lz4k_oplus.c" ]; then
             echo "Patching lz4k_oplus..."
             patch -p1 -F 3 < "${PATCH_DIR}/lz4k_oplus.patch" || true
          fi

      - name: Apply SCHED
        env:
          FILE: ${{ github.event.inputs.FILE }}
        if: ${{ github.event.inputs.SCHED == 'true' }}
        run: |
          set -x
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [ -d "kernel/sched/fengchi" ]; then
              echo "Fengchi/SCHED already exists. Skipping."
              exit 0
          fi
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU || { echo "CPU branch for SCHED not found"; exit 11; }
          cp ./SCHED_PATCH/fengchi_${FILE}.patch ./
          if [[ -f "fengchi_${FILE}.patch" ]]; then
            dos2unix "fengchi_${FILE}.patch"
            if patch -p1 --dry-run -F 3 < "fengchi_${FILE}.patch" > /dev/null 2>&1; then
                patch -p1 -F 3 < "fengchi_${FILE}.patch"
            else
                echo "SCHED patch pre-check failed. Skipping."
                find . -name "*.rej" -exec cp {} $GITHUB_WORKSPACE/debug_logs/patch_rejections/ \;
            fi
          else
            echo "No specific SCHED patch found for $FILE"
          fi

      - name: Apply LSM_BBG
        if: ${{ github.event.inputs.LSM == 'true' }}
        run: |
          set -x
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [ -d "security/baseband_guard" ]; then
              echo "Baseband Guard (LSM) already exists. Skipping."
          else
              echo "Applying Baseband Guard..."
              curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
              sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig
          fi

      - name: Add Configuration Settings
        run: |
          set -x
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"

          # Support both gki_defconfig and defconfig
          if [ -f "arch/arm64/configs/gki_defconfig" ]; then
             CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          elif [ -f "arch/arm64/configs/defconfig" ]; then
             CONFIG_FILE="arch/arm64/configs/defconfig"
          else
             echo "ERROR: No defconfig found in arch/arm64/configs/"
             ls -la arch/arm64/configs/ || true
             exit 1
          fi

          if [ ! -f "$CONFIG_FILE" ]; then
              echo "ERROR: Config file not found at $CONFIG_FILE"
              exit 1
          fi

          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"

          if [ "${{ github.event.inputs.SUSFS_META }}" != "-1" ]; then
            grep -q "CONFIG_KSU_SUSFS=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SUS_PATH=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SUS_MAP=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SUS_MOUNT=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SUS_KSTAT=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_ENABLE_LOG=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" "$CONFIG_FILE" || echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$CONFIG_FILE"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$CONFIG_FILE"
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"

          if [ "${{ github.event.inputs.BBR_ECN }}" = "true" ]; then
            grep -q "CONFIG_TCP_CONG_BBR=y" "$CONFIG_FILE" || echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_NET_SCH_FQ=y" "$CONFIG_FILE" || echo "CONFIG_NET_SCH_FQ=y" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$CONFIG_FILE"
            echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_ECN=y" "$CONFIG_FILE" || echo "CONFIG_IP_ECN=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_TCP_ECN=y" "$CONFIG_FILE" || echo "CONFIG_TCP_ECN=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IPV6_ECN=y" "$CONFIG_FILE" || echo "CONFIG_IPV6_ECN=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_NF_TARGET_ECN=y" "$CONFIG_FILE" || echo "CONFIG_IP_NF_TARGET_ECN=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.ZRAM }}" = "true" ]; then
            grep -q "CONFIG_CRYPTO_LZ4HC=y" "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_CRYPTO_LZ4K=y" "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_CRYPTO_LZ4KD=y" "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_CRYPTO_842=y" "$CONFIG_FILE" || echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_CRYPTO_LZ4K_OPLUS=y" "$CONFIG_FILE" || echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_ZRAM_WRITEBACK=y" "$CONFIG_FILE" || echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi

          if [ "${{ github.event.inputs.LSM }}" = "true" ]; then
            grep -q "CONFIG_BBG=y" "$CONFIG_FILE" || echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi

          if [[ "${CPU}" == sm* && "${{ github.event.inputs.NETFILTER }}" == "true" ]]; then
            grep -q "CONFIG_BPF_STREAM_PARSER=y" "$CONFIG_FILE" || echo "CONFIG_BPF_STREAM_PARSER=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" "$CONFIG_FILE" || echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_NETFILTER_XT_SET=y" "$CONFIG_FILE" || echo "CONFIG_NETFILTER_XT_SET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_MAX=65534" "$CONFIG_FILE" || echo "CONFIG_IP_SET_MAX=65534" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_BITMAP_IP=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_BITMAP_IPMAC=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_BITMAP_PORT=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IP=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IP=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IPMARK=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IPPORT=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IPPORTIP=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IPPORTNET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_IPMAC=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_MAC=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_MAC=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_NETPORTNET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_NET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_NET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_NETNET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_NETPORT=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_HASH_NETIFACE=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP_SET_LIST_SET=y" "$CONFIG_FILE" || echo "CONFIG_IP_SET_LIST_SET=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP6_NF_NAT=y" "$CONFIG_FILE" || echo "CONFIG_IP6_NF_NAT=y" >> "$CONFIG_FILE"
            grep -q "CONFIG_IP6_NF_TARGET_MASQUERADE=y" "$CONFIG_FILE" || echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$CONFIG_FILE"
          fi

          if [ "$KERNEL_VERSION" = "6.1" ] && [[ "$CPU" == mt* ]]; then
            echo "CONFIG_DEBUG_INFO_BTF=n" >> "$CONFIG_FILE"
          fi
          sed -i 's/check_defconfig//' ./build.config.gki 2>/dev/null || true

      - name: Fix IPv6_NAT Error
        if: ${{ github.event.inputs.NETFILTER == 'true' }}
        run: |
          set -x
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [[ "${CPU}" == sm* ]]; then
            patch -p1 --dry-run -F 3 < "${PATCH_DIR}/IPv6_NAT_FIX.patch" && patch -p1 -F 3 < "${PATCH_DIR}/IPv6_NAT_FIX.patch" || echo "IPv6 Fix skipped"
          fi

      - name: Custom BUILD_TIME
        shell: bash
        run: |
          set -x
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in ${{ env.KERNEL_SOURCE_DIR }}/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Enable lto=thin For FAST
        if: ${{ (env.KERNEL_VERSION == '5.10' || env.KERNEL_VERSION == '5.15') && github.event.inputs.FAST_BUILD == 'true' }}
        run: |
          set -x
          cd kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
          if [ -f "arch/arm64/configs/gki_defconfig" ]; then
              DEFCONFIG="arch/arm64/configs/gki_defconfig"
          else
              DEFCONFIG="arch/arm64/configs/defconfig"
          fi
          sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LTO_CLANG_NONE=y/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
          grep -q '^CONFIG_LTO_CLANG_THIN=y' "$DEFCONFIG" || echo 'CONFIG_LTO_CLANG_THIN=y' >> "$DEFCONFIG"

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          set -x
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile 2>/dev/null || true

      - name: Build Kernel FAST
        if: ${{ github.event.inputs.FAST_BUILD == 'true' }}
        id: fast_build
        run: |
          set -x
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          cd kernel_workspace/kernel_platform
          SOURCE_DIR="${{ env.KERNEL_SOURCE_DIR }}"

          if [[ -f ./$SOURCE_DIR/build.config.arm ]] && grep -q '^LLVM_IAS=1' ./$SOURCE_DIR/build.config.arm; then
            USE_LLVM_IAS=true
          else
            USE_LLVM_IAS=false
          fi

          # Try to find build.config in source dir
          CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./$SOURCE_DIR/build.config.common | cut -d= -f2 || true)
          
          # Try root if not in source dir (for flat kernels)
          if [[ -z "$CLANG_PREBUILT_BIN" ]] && [ -f ./build.config.common ]; then
              CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' ./build.config.common | cut -d= -f2 || true)
          fi

          if [[ -z "$CLANG_PREBUILT_BIN" ]]; then
            if [ -d "./prebuilts/clang/host/linux-x86" ]; then
                 CLANG_PATH=$(find ./prebuilts/clang/host/linux-x86 -maxdepth 1 -type d | grep -v prebuilts | head -1)
                 CLANG_PREBUILT_BIN="${CLANG_PATH}/bin"
            else
                 echo "fallback=true" >> "$GITHUB_OUTPUT"
                 exit 0
            fi
          fi

          if [[ "$CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            CLANG_VERSION="${BASH_REMATCH[1]}"
          else
            if [[ -f ./$SOURCE_DIR/build.config.constants ]]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./$SOURCE_DIR/build.config.constants | cut -d= -f2 || true)
            elif [ -f ./build.config.constants ]; then
              CLANG_VERSION=$(grep '^CLANG_VERSION=' ./build.config.constants | cut -d= -f2 || true)
            fi
          fi

          if [[ -z "$CLANG_VERSION" && -z "$CLANG_PREBUILT_BIN" ]]; then
             echo "Could not detect Clang. Falling back."
             echo "fallback=true" >> "$GITHUB_OUTPUT"
             exit 0
          fi
          
          if [[ -n "$CLANG_VERSION" ]]; then
              CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$CLANG_VERSION}
          fi

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$CLANG_PREBUILT_BIN:$PATH"
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          
          cd ./$SOURCE_DIR
          
          # Determine Defconfig name
          if [ -f "arch/arm64/configs/gki_defconfig" ]; then
              DEFCONFIG="gki_defconfig"
          else
              DEFCONFIG="defconfig"
          fi

          MAKE_ARGS="LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-"

          if [ -d "../../prebuilts/rust/linux-x86" ]; then
              MAKE_ARGS="$MAKE_ARGS RUSTC=$(realpath ../../prebuilts/rust)/linux-x86/1.73.0b/bin/rustc"
          fi
          if [ -d "../../prebuilts/kernel-build-tools/linux-x86" ]; then
              MAKE_ARGS="$MAKE_ARGS PAHOLE=$(realpath ../../prebuilts/kernel-build-tools)/linux-x86/bin/pahole"
          fi
          
          MAKE_ARGS="$MAKE_ARGS KCFLAGS+=-Wno-error"

          if [[ "$USE_LLVM_IAS" == "true" ]]; then
            MAKE_ARGS="LLVM_IAS=1 $MAKE_ARGS"
          fi

          make -j$(nproc --all) O=out $MAKE_ARGS $DEFCONFIG
          make -j$(nproc --all) O=out $MAKE_ARGS
          ccache -s

      - name: Fallback to Build Kernel
        if: ${{ github.event.inputs.FAST_BUILD == 'false' || steps.fast_build.outputs.fallback == 'true' }}
        run: |
          set -x
          cd kernel_workspace
          
          if [ -f ./kernel_platform/build_with_bazel.py ]; then
            ./kernel_platform/oplus/bazel/oplus_modules_variant.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
            ./kernel_platform/build_with_bazel.py -t ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          elif [ -f ./kernel_platform/oplus/build/oplus_build_kernel.sh ]; then
            LTO=thin SYSTEM_DLKM_RE_SIGN=0 BUILD_SYSTEM_DLKM=0 KMI_SYMBOL_LIST_STRICT_MODE=0 \
            ./kernel_platform/oplus/build/oplus_build_kernel.sh ${{ env.CPUD }} ${{ env.BUILD_METHOD }}
          else
            # Generic Make Fallback
            echo "No official build script found. Using generic make fallback."
            cd kernel_platform/${{ env.KERNEL_SOURCE_DIR }}
            
            export PATH=$(find ../../prebuilts/clang/host/linux-x86 -type d -name bin):$PATH
            export PATH="/usr/lib/ccache:$PATH"
            
            make -j$(nproc) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- O=out \
                KCFLAGS="-Wno-error" \
                Image.gz-dtb Image dtbo.img 2>&1 | tee $GITHUB_WORKSPACE/debug_logs/build.log
          fi

      - name: Make AnyKernel3
        run: |
          set -x
          mkdir -p $GITHUB_WORKSPACE/debug_logs/
          git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          
          # Image location logic
          SEARCH_DIR="kernel_workspace/kernel_platform"
          if [ "${{ env.KERNEL_SOURCE_DIR }}" != "." ]; then
              SEARCH_DIR="$SEARCH_DIR/${{ env.KERNEL_SOURCE_DIR }}"
          fi
          
          image_path=$(find "./$SEARCH_DIR/out/" -name "Image" | head -n 1)
          if [ -n "$image_path" ]; then
            echo "Found Image in out/"
          else
            image_path=$(find "./$SEARCH_DIR/" -maxdepth 3 -name "Image" -o -name "Image.gz-dtb" | head -n 1)
            if [ -n "$image_path" ]; then
               echo "Found Image/Image.gz-dtb at $image_path"
            else
              echo "ERROR: No Image found."
              echo "=== Directory Listing ===" > $GITHUB_WORKSPACE/debug_logs/missing_image.log
              ls -laR ./kernel_workspace >> $GITHUB_WORKSPACE/debug_logs/missing_image.log
              exit 1
            fi
          fi
          cp "$image_path" ./AnyKernel3/Image
          cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image

      - name: Apply patch_linux and Replace Image
        if: ${{ github.event.inputs.KPM == 'true' }}
        run: |
          set -x
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          OUT_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/out/Final-Image-Find"
          cd "${OUT_DIR}"
          if [ -f "${PATCH_DIR}/patch_linux" ]; then
              cp "${PATCH_DIR}/patch_linux" .
              chmod +x patch_linux
              ./patch_linux
              rm -f Image
              mv oImage Image
              cp Image "${GITHUB_WORKSPACE}/AnyKernel3/Image"
          else
              echo "patch_linux not found, skipping."
          fi

      - name: Download SUSFS Module (CI)
        if: ${{ github.event.inputs.SUSFS_CI == 'CI' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          set -x
          LATEST_RUN_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs?status=success" | \
            jq -r '.workflow_runs[] | select(.head_branch == "v1.5.2+") | .id' | head -n 1)
          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No successful run found"
          else
            ARTIFACT_URL=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$LATEST_RUN_ID/artifacts" | jq -r '.artifacts[0].archive_download_url')
            if [ -n "$ARTIFACT_URL" ]; then
              curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -o ksu_module_susfs_1.5.2+_CI.zip "$ARTIFACT_URL"
              cp ksu_module_susfs_1.5.2+_CI.zip ./AnyKernel3/
            fi
          fi

      - name: Download SUSFS Module (Release)
        if: ${{ github.event.inputs.SUSFS_CI == 'Release' && github.event.inputs.SUSFS_META != '-1' }}
        continue-on-error: true
        run: |
          set -x
          wget -O ksu_module_susfs_1.5.2+_Release.zip https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs_1.5.2+.zip
          cp ksu_module_susfs_1.5.2+_Release.zip ./AnyKernel3/

      - name: Download SukiSU-Ultra APK
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          MANAGER_SOURCE="${{ github.event.inputs.MANAGER_SOURCE }}"
          case "$MANAGER_SOURCE" in
            MIUIX)
              BRANCH="miuix"
              ARTIFACT_NAME="Manager"
              ;;
            SPOOF)
              BRANCH="main"
              ARTIFACT_NAME="Spoofed-Manager"
              ;;
            OFFICIAL|*)
              BRANCH="main"
              ARTIFACT_NAME="Manager"
              ;;
          esac
          run_id=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/workflows/build-manager.yml/runs?branch=$BRANCH&status=success&per_page=1" \
            --jq '.workflow_runs[0].id' || echo "")
          if [[ -z "$run_id" ]]; then exit 0; fi
          artifact_url=$(gh api \
            "repos/SukiSU-Ultra/SukiSU-Ultra/actions/runs/$run_id/artifacts" | \
            jq -r ".artifacts[] | select(.name == \"$ARTIFACT_NAME\") | .archive_download_url" | head -n1)
          if [[ -z "$artifact_url" ]]; then exit 0; fi
          curl -fL -H "Authorization: token $GITHUB_TOKEN" -o "${ARTIFACT_NAME}.zip" "$artifact_url"
          unzip -j "${ARTIFACT_NAME}.zip" "*.apk" -d ./AnyKernel3/

      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ github.event.inputs.ZRAM == 'true' && '_LZ4KD' || '' }}${{ github.event.inputs.KPM == 'true' && '_KPM' || '' }}${{ github.event.inputs.LSM == 'true' && '_LSM' || '' }}_ILH${{ github.event.inputs.SCHED== 'true' && '_SCHED' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_SukiSUUltra_${{ env.KSUVER }}_${{ steps.extract_info.outputs.value }}(${{ env.TKERNEL_VERSION }})${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Download ZRAM Module
        if: ${{ github.event.inputs.ZRAM == 'true' }}
        id: zram_find
        run: |
          set -x
          set -e
          sudo apt install -y unzip
          retries=3
          success=0
          for i in $(seq 1 $retries); do
            download_url=$(curl -s https://api.github.com/repos/FurLC/ZRAM-Module/releases/latest | \
              grep "browser_download_url" | grep "ZRAM-Module-.*\.zip" | cut -d '"' -f 4 | head -n 1)
            if [ -n "$download_url" ]; then
              wget -N "$download_url" && success=1 && break
            fi
            sleep 3
          done
          if [ "$success" -ne 1 ]; then
             echo "Failed to download ZRAM module"
             exit 1
          fi
          unzip -o ZRAM-Module-*.zip -d ./AnyKernel3/

      - name: Upload Debug Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Debug_Logs_Failure
          path: |
            debug_logs/
            kernel_workspace/kernel_platform/${{ env.KERNEL_SOURCE_DIR }}/out/.config
