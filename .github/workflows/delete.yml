name: 🧹 Nettoyage des Workflows et du Cache
on:
  workflow_dispatch:
    inputs:
      workflow_name:
        type: choice
        description: 'Nom du workflow à nettoyer'
        required: true
        default: '🚀 Construire OnePlus SukiSU Ultra (Tout en un) 📱'
        options:
          - '🚀 Construire OnePlus SukiSU Ultra (Tout en un) 📱'
          - '🚀 Lancer le Build Groupé'
          - 'Build TEST'
          - 'Build TEST2'
      cache_mode:
        type: choice
        description: 'Type de nettoyage du cache'
        required: false
        default: 'none'
        options:
          - none
          - all
          - ccache
          - apt-cache
      count:
        description: 'Nombre maximum de runs à traiter'
        required: false
        default: '20'
      delete_failed:
        description: 'Supprimer les runs échoués ?'
        required: false
        type: boolean
        default: true
      delete_success:
        description: 'Supprimer les runs réussis ?'
        required: false
        type: boolean
        default: false
      delete_cancelled:
        description: 'Supprimer les runs annulés ?'
        required: false
        type: boolean
        default: false
      reverse_order:
        description: 'Nettoyer du plus ancien au plus récent ?'
        required: false
        type: boolean
        default: false
      cancel_all:
        description: 'Annuler tous les runs en cours pour ce workflow ?'
        required: false
        type: boolean
        default: false

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Installation de l'environnement
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq

      - name: 🔐 Authentification GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: 🧹 Nettoyage des enregistrements du workflow
        env:
          REPO: ${{ github.repository }}
          COUNT: ${{ inputs.count }}
          DELETE_FAILED: ${{ inputs.delete_failed }}
          DELETE_SUCCESS: ${{ inputs.delete_success }}
          DELETE_CANCELLED: ${{ inputs.delete_cancelled }}
          REVERSE_ORDER: ${{ inputs.reverse_order }}
          CANCEL_ALL: ${{ inputs.cancel_all }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -e

          echo "Recherche de l'ID pour le workflow \"$WORKFLOW_NAME\"..."
          WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows | jq -r ".workflows[] | select(.name == \"$WORKFLOW_NAME\") | .id")
          if [ -z "$WORKFLOW_ID" ]; then
            echo "Workflow \"$WORKFLOW_NAME\" introuvable, sortie."
            exit 1
          fi

          echo "Récupération des enregistrements par page..."
          PER_PAGE=100
          PAGE=1
          ALL_RUNS="[]"
          while true; do
            RESP=$(gh api "repos/$REPO/actions/workflows/$WORKFLOW_ID/runs?per_page=$PER_PAGE&page=$PAGE")
            RUNS=$(echo "$RESP" | jq '.workflow_runs')
            COUNT_THIS_PAGE=$(echo "$RUNS" | jq 'length')
            if [ "$COUNT_THIS_PAGE" -eq 0 ]; then break; fi
            ALL_RUNS=$(jq -s 'add' <(echo "$ALL_RUNS") <(echo "$RUNS"))
            PAGE=$((PAGE + 1))
          done

          echo "Total : $(echo "$ALL_RUNS" | jq 'length') enregistrements trouvés."

          if [[ "$CANCEL_ALL" == "true" ]]; then
            echo "Annulation des runs en cours ou en attente..."
            CANCEL_COUNT=0
            echo "$ALL_RUNS" | jq -c '.[] | select(.status == "in_progress" or .status == "queued")' | while read run; do
              ID=$(echo "$run" | jq -r '.id')
              if [[ "$ID" == "$CURRENT_RUN_ID" ]]; then continue; fi
              echo "Annulation du run ID: $ID"
              gh api -X POST "repos/$REPO/actions/runs/$ID/cancel" && CANCEL_COUNT=$((CANCEL_COUNT + 1))
            done
            echo "$CANCEL_COUNT runs annulés."
          fi

          echo "Traitement de la suppression..."
          if [[ "$REVERSE_ORDER" == "true" ]]; then
            SORTED_RUNS=$(echo "$ALL_RUNS" | jq 'sort_by(.run_started_at)')
          else
            SORTED_RUNS=$(echo "$ALL_RUNS" | jq 'sort_by(.run_started_at) | reverse')
          fi

          TO_DELETE_RUNS=$(echo "$SORTED_RUNS" | jq ".[0:${COUNT}]")

          echo "$TO_DELETE_RUNS"| jq -c '.[]' | while read run; do
            ID=$(echo "$run" | jq -r '.id')
            STATUS=$(echo "$run" | jq -r '.conclusion')
            STATE=$(echo "$run" | jq -r '.status')

            if [[ "$STATE" == "in_progress" || "$STATE" == "queued" ]]; then continue; fi
            if [[ "$STATUS" == "failure" && "$DELETE_FAILED" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "success" && "$DELETE_SUCCESS" != "true" ]]; then continue; fi
            if [[ "$STATUS" == "cancelled" && "$DELETE_CANCELLED" != "true" ]]; then continue; fi

            echo "Suppression du run ID: $ID"
            gh api -X DELETE "repos/$REPO/actions/runs/$ID" || echo "Échec de la suppression"
          done

          echo "Nettoyage des enregistrements de ce workflow (Hors actuel)..."
          SELF_WORKFLOW_ID=$(gh api repos/$REPO/actions/workflows | jq -r '.workflows[] | select(.name == "🧹 Nettoyage des Workflows et du Cache") | .id')
          if [ -n "$SELF_WORKFLOW_ID" ]; then
            SELF_RUNS=$(gh api "repos/$REPO/actions/workflows/$SELF_WORKFLOW_ID/runs?per_page=50" | jq -c '.workflow_runs[]')
            echo "$SELF_RUNS" | while read run; do
              ID=$(echo "$run" | jq -r '.id')
              if [[ "$ID" == "$CURRENT_RUN_ID" ]]; then continue; fi
              echo "Suppression du run ID: $ID"
              gh api -X DELETE "repos/$REPO/actions/runs/$ID" || echo "Échec de la suppression"
            done
          fi

  clean-caches:
    runs-on: ubuntu-latest
    needs: cleanup
    if: ${{ inputs.cache_mode != 'none' }}
    permissions:
      actions: write
    steps:
      - name: 🧹 Nettoyage du cache selon le mode
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            const mode = process.env.CACHE_MODE || '${{ inputs.cache_mode }}';
            console.log(`🔹 当前缓存清理模式: ${mode}`);

            let totalDeleted = 0;
            let totalFound = 0;
            let page = 1;

            while (true) {
              const res = await github.rest.actions.getActionsCacheList({
                owner,
                repo,
                per_page: 100,
                page
              });

              const caches = res.data.actions_caches;
              if (!caches || caches.length === 0) break;

              for (const cache of caches) {
                const key = cache.key;
                let matched = false;

                switch (mode) {
                  case 'all':
                    matched = true;
                    break;
                  case 'ccache':
                    matched = key.startsWith('ccache-');
                    break;
                  case 'apt-cache':
                    matched = key.includes('apt-cache') || key.includes('apt');
                    break;
                  default:
                    matched = false;
                }

                if (matched) {
                  totalFound++;
                  console.log(`删除缓存: ${key}`);
                  try {
                    await github.rest.actions.deleteActionsCacheById({
                      owner,
                      repo,
                      cache_id: cache.id
                    });
                    totalDeleted++;
                  } catch (err) {
                    console.log(`删除缓存失败: ${key}`);
                  }
                }
              }

              if (caches.length < 100) break;
              page++;
            }

            if (totalFound === 0) {
              console.log("没有找到符合条件的缓存。");
            } else {
              console.log(`共找到 ${totalFound} 个缓存，成功删除 ${totalDeleted} 个。`);
            }